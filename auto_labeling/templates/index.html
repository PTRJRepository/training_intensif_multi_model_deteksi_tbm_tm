<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sawit Auto Labeling</title>
    
    <!-- CSS Libraries -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">
                <i class="fas fa-eye"></i> Sawit Auto Labeling
            </a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3" id="status-indicator">
                    <i class="fas fa-circle text-success"></i> Ready
                </span>
                <span class="navbar-text" id="points-counter">
                    <i class="fas fa-map-marker-alt"></i> Points: <span id="points-count">0</span>
                </span>
            </div>
        </div>
    </nav>

    <div class="container-fluid p-3">
        <div class="row g-3">
            
            <!-- Left Panel - Controls -->
            <div class="col-lg-3">
                
                <!-- Upload Card -->
                <div class="card mb-3">
                    <div class="card-header">
                        <i class="fas fa-upload"></i> Upload Image
                    </div>
                    <div class="card-body">
                        <input type="file" id="imageInput" class="form-control mb-3" accept="image/*">
                        <button class="btn btn-primary w-100" onclick="uploadImage()">
                            <i class="fas fa-cloud-upload-alt"></i> Upload
                        </button>
                        <div class="progress mt-3 d-none" id="upload-progress">
                            <div class="progress-bar" id="upload-progress-bar"></div>
                        </div>
                    </div>
                </div>

                <!-- Labels Management -->
                <div class="card mb-3">
                    <div class="card-header">
                        <i class="fas fa-tags"></i> Labels
                    </div>
                    <div class="card-body">
                        <div id="labels-list">
                            <!-- Labels will be populated here -->
                        </div>
                        <div class="input-group mt-2">
                            <input type="text" class="form-control form-control-sm" id="new-label-input" placeholder="New label">
                            <button class="btn btn-outline-secondary btn-sm" onclick="addLabel()">
                                <i class="fas fa-plus"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Tools -->
                <div class="card mb-3">
                    <div class="card-header">
                        <i class="fas fa-tools"></i> Tools
                    </div>
                    <div class="card-body">
                        <div class="btn-group w-100 mb-2" role="group">
                            <button class="btn btn-sm btn-outline-primary active" id="add-tool" onclick="setTool('add')">
                                <i class="fas fa-map-marker-alt"></i> Add
                            </button>
                            <button class="btn btn-sm btn-outline-danger" id="delete-tool" onclick="setTool('delete')">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                            <button class="btn btn-sm btn-outline-warning" id="move-tool" onclick="setTool('move')">
                                <i class="fas fa-arrows-alt"></i> Move
                            </button>
                        </div>

                        <!-- Auto Label Button -->
                        <button class="btn btn-success w-100 mb-2" onclick="autoLabel()">
                            <i class="fas fa-robot"></i> Auto Label (AI)
                        </button>
                        <div class="mb-2">
                            <label class="form-label small mb-1">Confidence Threshold: <span id="conf-value">0.25</span></label>
                            <input type="range" class="form-range" id="conf-threshold" min="0.1" max="0.9" step="0.05" value="0.25" oninput="document.getElementById('conf-value').textContent = this.value">
                        </div>
                        <div class="mb-2">
                            <label class="form-label small mb-1">IOU Threshold: <span id="iou-value">0.45</span></label>
                            <input type="range" class="form-range" id="iou-threshold" min="0.1" max="0.9" step="0.05" value="0.45" oninput="document.getElementById('iou-value').textContent = this.value">
                        </div>

                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" id="show-labels" checked>
                            <label class="form-check-label" for="show-labels">Show Labels</label>
                        </div>

                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" id="snap-to-grid">
                            <label class="form-check-label" for="snap-to-grid">Snap to Grid</label>
                        </div>
                    </div>
                </div>

                <!-- Zoom Controls -->
                <div class="card mb-3">
                    <div class="card-header">
                        <i class="fas fa-search"></i> Zoom
                    </div>
                    <div class="card-body">
                        <div class="btn-group w-100 mb-2" role="group">
                            <button class="btn btn-sm btn-outline-secondary" onclick="zoomIn()">
                                <i class="fas fa-search-plus"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-secondary" onclick="fitImage()">
                                <i class="fas fa-expand"></i> Fit
                            </button>
                            <button class="btn btn-sm btn-outline-secondary" onclick="zoomOut()">
                                <i class="fas fa-search-minus"></i>
                            </button>
                        </div>
                        <input type="range" class="form-range" id="zoom-slider" min="10" max="500" value="100" oninput="setZoom(this.value)">
                        <small class="form-text text-muted">Zoom: <span id="zoom-percent">100%</span></small>
                    </div>
                </div>

                <!-- Export Options -->
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-download"></i> Export
                    </div>
                    <div class="card-body">
                        <div class="d-grid gap-2">
                            <button class="btn btn-outline-primary btn-sm" onclick="exportData('csv')">
                                <i class="fas fa-file-csv"></i> CSV
                            </button>
                            <button class="btn btn-outline-primary btn-sm" onclick="exportData('geojson')">
                                <i class="fas fa-globe"></i> GeoJSON
                            </button>
                            <button class="btn btn-primary btn-sm" onclick="exportData('shapefile')">
                                <i class="fas fa-map"></i> Shapefile
                            </button>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Right Panel - Image Canvas -->
            <div class="col-lg-9">
                <!-- Image Canvas Container -->
                <div class="canvas-container" id="canvas-container">
                    <canvas id="main-canvas"></canvas>
                    <div class="canvas-info">
                        <small class="text-muted">
                            <span id="mouse-coords">X: 0, Y: 0</span> | 
                            <span id="zoom-level">100%</span>
                        </small>
                    </div>
                </div>

                <!-- Status Bar -->
                <div class="mt-3 p-2 bg-light rounded">
                    <div class="d-flex justify-content-between align-items-center">
                        <small class="text-muted">
                            <i class="fas fa-image"></i> <span id="image-info">No image loaded</span>
                        </small>
                        <small class="text-muted">
                            <i class="fas fa-map-marker-alt"></i> <span id="points-summary">0 points added</span>
                        </small>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Loading Modal -->
    <div class="modal fade" id="loadingModal" tabindex="-1">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <div class="modal-body text-center">
                    <div class="spinner-border text-primary mb-2" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mb-0" id="loading-text">Processing...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="position-fixed top-0 end-0 p-3" style="z-index: 1050">
        <div class="toast" id="mainToast" role="alert">
            <div class="toast-header">
                <i class="fas fa-info-circle text-primary me-2"></i>
                <strong class="me-auto">Sawit Labeling</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toast-message">
                Message here
            </div>
        </div>
    </div>

    <!-- JS Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
